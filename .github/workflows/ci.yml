# CI = verificação automática a cada push: o GitHub roda as mesmas checagens
# que rodam local (pnpm check + build). Se quebrar, o push fica marcado com ❌.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version:` aqui de propósito. A versão do pnpm vem do campo
      # "packageManager" do package.json — declarar nos dois lugares faz a
      # ação abortar com ERR_PNPM_BAD_PM_VERSION antes de instalar qualquer coisa.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
